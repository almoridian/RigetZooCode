<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Zoo Tickets - Riget Zoo Adventures</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" role="navigation" aria-label="Main">
        <div class="container">
            <div class="navbar-brand">
                <h1><a href="../index.html">🦁 Riget Zoo Adventures</a></h1>
            </div>
            <div class="navbar-auth" id="navAuth"></div>
        </div>
    </nav>

    <main id="main-content" role="main">
        <section class="booking-section">
            <div class="container">
                <h2>Book Zoo Tickets</h2>

                <!-- Booking Form -->
                <div class="booking-container">
                    <form id="bookingForm" aria-label="Zoo ticket booking form">
                        <fieldset>
                            <legend>Select your tickets</legend>

                            <!-- Ticket Type -->
                            <div class="form-group">
                                <label for="ticketType">Ticket Type</label>
                                <select id="ticketType" name="ticketType" required aria-required="true">
                                    <option value="">-- Select ticket type --</option>
                                </select>
                                <span class="error-message" id="ticketTypeError" role="alert"></span>
                            </div>

                            <!-- Booking Date -->
                            <div class="form-group">
                                <label for="bookingDate">Date</label>
                                <input 
                                    type="date" 
                                    id="bookingDate" 
                                    name="bookingDate" 
                                    required 
                                    aria-required="true"
                                >
                                <span class="error-message" id="bookingDateError" role="alert"></span>
                            </div>

                            <!-- Quantity -->
                            <div class="form-group">
                                <label for="quantity">Number of Tickets</label>
                                <input 
                                    type="number" 
                                    id="quantity" 
                                    name="quantity" 
                                    min="1" 
                                    max="10"
                                    value="1"
                                    required 
                                    aria-required="true"
                                >
                                <span class="error-message" id="quantityError" role="alert"></span>
                            </div>

                            <!-- Check Availability -->
                            <button type="button" id="checkAvailBtn" class="btn btn-secondary">
                                Check Availability
                            </button>
                        </fieldset>
                    </form>

                    <!-- Availability Result -->
                    <div id="availabilityResult" class="availability-result hidden">
                        <p id="availabilityMessage"></p>
                    </div>

                    <!-- Price Summary -->
                    <div class="price-summary hidden" id="priceSummary">
                        <h3>Order Summary</h3>
                        <div class="summary-row">
                            <span>Ticket Type:</span>
                            <strong id="summaryTicketType"></strong>
                        </div>
                        <div class="summary-row">
                            <span>Date:</span>
                            <strong id="summaryDate"></strong>
                        </div>
                        <div class="summary-row">
                            <span>Price per ticket:</span>
                            <strong id="summaryPrice"></strong>
                        </div>
                        <div class="summary-row">
                            <span>Quantity:</span>
                            <strong id="summaryQuantity"></strong>
                        </div>
                        <hr>
                        <div class="summary-row total">
                            <span>Total:</span>
                            <strong id="summaryTotal"></strong>
                        </div>

                        <!-- Book Button (requires auth) -->
                        <button id="bookBtn" class="btn btn-primary btn-block" style="margin-top: 20px;">
                            Proceed to Checkout
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Messages -->
        <div class="success-message hidden" id="successMessage" role="status"></div>
        <div class="error-message hidden" id="errorMessage" role="alert"></div>
    </main>

    <footer role="contentinfo">
        <div class="container footer-content">
            <p>&copy; 2026 Riget Zoo Adventures. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/auth.js"></script>
    <script src="../js/booking.js"></script>
</body>
</html>
